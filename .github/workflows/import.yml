name: Import portfolio source
on:
  push:
    paths: [portfolio-source.b64]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified source files
        run: |
          python3 - <<'PY'
          import base64, io, zipfile
          from pathlib import Path
          bundle = Path("portfolio-source.b64")
          if not bundle.exists():
              raise SystemExit("Source bundle not present.")
          root = Path.cwd().resolve()
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(bundle.read_text()))) as archive:
              for name in archive.namelist():
                  target = (root / name).resolve()
                  if not target.is_relative_to(root) or name.startswith((".git/", ".github/")):
                      raise SystemExit("Unexpected archive path")
              archive.extractall(root)
          bundle.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Import verified bilingual Next.js portfolio source"
          git push
